name: Validate people data

on:
  pull_request:
    paths: [data/mentors.json, data/participants.json]
  push:
    branches: [main]
    paths: [data/mentors.json, data/participants.json]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate data/mentors.json and data/participants.json
        run: |
          python3 - <<'PY'
          import json, sys

          failed = False
          for group in ("mentors", "participants"):
              path = f"data/{group}.json"
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"::error file={path}::Invalid JSON: {e}")
                  failed = True
                  continue

              errors = []
              if not isinstance(data, list):
                  errors.append("top level must be a list")
                  data = []
              for i, person in enumerate(data):
                  where = f"[{i}]"
                  if not isinstance(person, dict):
                      errors.append(f"{where} must be an object")
                      continue
                  name = person.get("name")
                  if not isinstance(name, str) or not name.strip():
                      errors.append(f"{where}.name is required and must be a non-empty string")
                  for key in ("linkedin", "avatar", "tag"):
                      if key in person and not isinstance(person[key], str):
                          errors.append(f"{where}.{key} must be a string")
                  for key in ("education", "experience"):
                      if key in person:
                          v = person[key]
                          if not isinstance(v, list) or not all(isinstance(x, str) for x in v):
                              errors.append(f"{where}.{key} must be a list of strings")

              for e in errors:
                  print(f"::error file={path}::{e}")
              failed = failed or bool(errors)

          if failed:
              sys.exit(1)
          print("mentors.json and participants.json are valid")
          PY
